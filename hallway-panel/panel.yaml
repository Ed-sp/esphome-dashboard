# Hallway panel configuration.
# Everything the layout needs to know that isn't a design decision lives here.

panel:
  # 640x384 is the Waveshare 7.5" V1 (ESPHome model 7.50in); 800x480 is the V2
  # (7.50inv2). Each has its own hand-tuned layout in panel/render/geometry.py --
  # they are not scaled versions of one another, because 1-bit type does not
  # survive being multiplied by 0.8. Both keep the full seven-day forecast;
  # the smaller panel gives up one calendar event, one stat and one alert
  # instead. An unlisted size fails at startup rather than at render time.
  width: 640
  height: 384

  # "density" | "columns" | "ribbon" — how rain is drawn under the temperature curve.
  rain_style: density

home_assistant:
  # For the add-on this becomes http://supervisor/core and SUPERVISOR_TOKEN.
  base_url: http://homeassistant.local:8123
  token_env: HA_TOKEN
  timezone: Europe/London

weather:
  entity: weather.home
  # Hours of hourly forecast to plot across the graph band.
  hours: 24

people:
  - key: ed
    name: Ed
    badge: E
    person: person.edward_speirs
    calendar: calendar.gmail
  - key: hannah
    name: Hannah
    badge: H
    person: person.hannah
    calendar: calendar.hannah_sebastian_googlemail_com

# Commute targets. Ed's is switchable here; Hannah's is fixed for now but uses
# the same shape so it can gain options later without a code change.
commute:
  # Which workplace Ed is currently commuting to. Must match a key under `workplaces`.
  ed_workplace: yarnton

  workplaces:
    yarnton:
      label: Yarnton
      zone: zone.work_yarnton
    abingdon:
      label: Abingdon
      zone: zone.work_abingdon

  hannah_workplace:
    label: Oxford
    zone: zone.work_hannah

  # Travel-time sensors from the Google Maps Travel Time integration.
  #
  # combined_car is NOT one of them: the integration does origin-to-destination
  # only, with no waypoints, so a home -> Ed's work -> Hannah's work journey
  # cannot be asked for directly. It is a min_max helper in `sum` mode over two
  # legs, the first of which is ed_car and already polled:
  #
  #     leg 1   sensor.ed_to_work_car          home -> Yarnton
  #     leg 2   sensor.yarnton_to_hannah_work  Yarnton -> Hannah's work
  #     sum     sensor.combined_commute_car
  #
  # Worth knowing what that approximates away: leg 2 is priced with the traffic
  # happening *now* rather than in twenty minutes' time, and the handover at
  # Ed's work counts as zero. On a building rush hour the real journey runs a
  # little longer than the sum.
  sensors:
    ed_bike: sensor.ed_to_work_bike
    ed_car: sensor.ed_to_work_car
    hannah_car: sensor.hannah_to_work_car
    combined_car: sensor.combined_commute_car

  # Baselines: 30-day median statistics sensors. Left empty until they have history.
  baselines:
    ed_bike: sensor.ed_to_work_bike_median
    ed_car: sensor.ed_to_work_car_median
    hannah_car: sensor.hannah_to_work_car_median
    combined_car: sensor.combined_commute_car_median

  rules:
    # Ed cycles only before this time, and only if the ride window stays dry.
    bike_cutoff: "07:15"
    # Past this, the commute block disappears entirely.
    hide_after: "09:00"
    # Hannah's direct route is shown from here when Ed is away.
    hannah_solo_from: "07:00"
    # Minutes of forecast to check for rain before recommending the bike.
    ride_window_minutes: 45
    # Flag "slower than usual" past BOTH of these, whichever is larger.
    slow_pct: 20
    slow_minutes: 8

waste:
  # The calendar, not the sensor. The sensor keys its attributes by date with
  # the waste type as the value, so the keys change every collection and any
  # config matching on them would need rewriting fortnightly.
  calendar: calendar.vale_of_white_horse_district_council

  # Show from this time the evening before until noon on collection day.
  show_from: "17:00"
  hide_at: "12:00"

  # `match` is a case-insensitive substring of what the council calls the
  # collection; first match wins. The labels are what appears on the wall --
  # "Non-recyclable refuse waste" is not a thing to read from across a hallway.
  # `exclude` earns its place here: the Vale calls a rubbish week
  # "Non-recyclable refuse waste", which contains "recycl". Without it the panel
  # confidently tells you to put the recycling out on a rubbish week.
  types:
    - { match: recycl, exclude: non-recycl, label: Recycling, icon: recycle }
    - { match: refuse, label: Rubbish, icon: bin }
    - { match: garden, label: Garden waste, icon: leaf }
    # Weekly, so it is never news. Left here so the log does not complain about
    # an unmatched type every time one comes round.
    - { match: food, label: Food waste, icon: leaf, show: false }

alerts:
  # Device batteries below this raise a line in "Needs you".
  battery_below: 20
  # The panel's own battery only speaks up down here.
  panel_battery_below: 10
  panel_rssi_below: -80
  # Cap so the block can never overflow its band.
  max_lines: 3
  # A plant only raises an alert once it has a moisture sensor. An interval
  # alone is not enough to go on -- with no last-watered date to count from,
  # guessing would put a permanent nag on the wall.
  #
  # `moisture_below` is per plant on purpose. A dracaena wants to dry out
  # properly between waterings and rots far more readily than it wilts, so 20-25
  # is right for it where these sensors often default to 40. Set it by what the
  # plant wants, not by what the sensor suggests.
  # `sensor` takes either a moisture percentage or a binary sensor. Pointing it
  # at the threshold helper means the panel and the phone notification read the
  # same entity, hysteresis included, so they cannot disagree at the boundary.
  # Point it at sensor.soil_sensor_humidity instead and moisture_below applies.
  plants:
    - name: Dracaena
      sensor: binary_sensor.dracaena_needs_water
      moisture_below: 22    # only used if `sensor` is a numeric one

calendar:
  # How many events to list, and how far ahead to look.
  count: 4
  days_ahead: 14

  # Calendars with nobody behind them. Read after `people`, so an event that is
  # on both a shared calendar and someone's own gets badged to the person.
  extra:
    - { badge: F, entity: calendar.family }
    # Birthdays are all-day and arrive as a wall of them around a family's
    # clusters; switch on if you want them competing for the four slots.
    # - { badge: "*", entity: calendar.birthdays }
    # - { badge: "*", entity: calendar.holidays_in_united_kingdom }

stats:
  # Four slots in the bottom-right block. Each needs `label` and a `kind`.
  - label: Telly
    kind: history_hours
    entities:
      - media_player.edward_s_fire_tv_cube
      - media_player.edward_s_firetvstick
      - media_player.fire_tv
    state: playing
  - label: Music
    kind: history_hours
    entities:
      - media_player.lounge
      - media_player.living_room
      - media_player.downstairs
      - media_player.kitchen_dot
    state: playing
  # Add Hannah's Health Connect sensor as a second entity and change the label
  # to "Steps · Ed / Hannah"; until then this shows Ed's on its own rather than
  # holding the row at a dash.
  - label: Steps · Ed
    kind: pair
    entities:
      - sensor.edwards_s23_daily_steps
  # A utility_meter on the Hildebrand Glow (DCC) daily figure. The DCC variant
  # only publishes "usage today" and no cumulative reading, but it is marked
  # total_increasing, so utility_meter reads the midnight reset as a reset
  # rather than as consumption and accumulates the week correctly.
  #
  # It reads low until a full week has passed, since it starts counting from
  # whenever it was created rather than backfilling.
  - label: Electricity
    kind: sum_energy
    entities:
      - sensor.electricity_this_week

collect:
  # Local table; no network, no scraping.
  source: data/collects.yaml

  # On the ~48 days a year with no collect, show a verse of the day instead of
  # cycling the bundled psalms. Two providers, opposite trades:
  #
  #   youversion  One vendor, one key, curated daily selection. Two calls: the
  #               verse-of-the-day endpoint returns only a reference, and the
  #               text comes from /bibles/{id}/passages/{ref}.
  #
  #               A key alone is not enough. Text access needs a licence
  #               agreement accepted PER VERSION at developers.youversion.com --
  #               until then /bibles returns 204 and every passage returns 403,
  #               even public-domain WEBUS. Once accepted, /bibles lists what the
  #               key can reach; put that id in version_id below. The ESV is not
  #               in their catalogue at all.
  #               Key from https://developers.youversion.com/ as YOUVERSION_APP_KEY.
  #
  #   esv         One call, and it is the ESV. The daily selection comes from
  #               data/verses.yaml, which is a list rather than a curation.
  #               Free non-commercial key from https://api.esv.org/ (5000 a day,
  #               this uses one) as ESV_API_KEY.
  #
  # Keys are read from the environment and never written here. With this off, or
  # the key missing, or the publisher unreachable, the psalms still cover the day.
  verse:
    enabled: true
    provider: youversion

    # Which environment variable holds the key. Never write the key here.
    api_key_env: YOUVERSION_APP_KEY

    # 113 is NIVUK11, "New International Version (Anglicized) 2011".
    #
    # Finding an id:
    #   /bibles?language_ranges[]=en                      what the key is licensed for
    #   /bibles?language_ranges[]=en&all_available=true   the whole catalogue
    #
    # The first can answer 204 even while passages work perfectly, so it is not
    # the test of whether a version is readable -- fetching a passage is. Accept
    # the licence for the version you want at developers.youversion.com, or
    # every passage 403s, public-domain ones included.
    version_id: 113

    # Shown after the reference, e.g. "Romans 6:5 · NIVUK". Empty for just the
    # chapter and verse. It doubles as the on-panel attribution, so leaving it
    # empty is a choice worth making deliberately: fine for a private display,
    # less so anywhere the text is published. Biblica's full notice lives in the
    # version metadata at /bibles/113.
    version_label: ""

sky:
  # How far ahead any provider is allowed to look.
  lookahead_days: 7

  # One block per provider. `enabled: false` switches one off without touching
  # code; anything not listed here is on by default. They compete for a single
  # line, and the highest-ranked event wins.
  #
  # To add one: write a function in panel/sources/sky/, decorate it with
  # @provider("name"), import it in that package's __init__, and give it a block
  # here. Nothing else needs to change.
  events:
    eclipses:
      enabled: true

    showers:
      enabled: true
      # Ignore anything fainter than this, in meteors per hour at best. Raise to
      # 50 for just the Perseids, Geminids and Quadrantids.
      min_zhr: 0

    moon:
      # The full moon, once a month. The first thing to turn off if the line
      # starts feeling like wallpaper.
      enabled: true

    aurora:
      enabled: true
      # AuroraWatch UK's four levels are green, yellow, amber and red,
      # calibrated to UK latitudes. From Oxfordshire, amber means "worth
      # looking north" and red means "go outside". Set to red if amber
      # turns out to be noise.
      threshold: amber
      # Lancaster ask for no more than one request every 3 minutes. This is the
      # gap between fetches; 15 is still far fresher than the panel refreshes.
      poll_minutes: 15

refresh:
  # How long the last good render stays trustworthy once Home Assistant stops
  # answering. Inside this, the panel keeps showing it -- an hour-old forecast is
  # still roughly right. Past it, the fallback screen appears instead, because a
  # stale panel that looks current is worse than one that admits it does not know.
  trust_last_render_hours: 6

  awake_minutes: 20
  commute_minutes: 10
  away_minutes: 60
  asleep_entity: schedule.sleeping
  wake_after_sleep: "05:45"
  commute_window: ["06:00", "09:00"]
