# Home Assistant add-on manifest.
#
# This repository *is* the add-on: copy it to /addons/hallway-panel on the Home
# Assistant machine (the Samba or SSH add-on will do), then Settings ->
# Add-ons -> Add-on store -> three dots -> Check for updates.
#
# The panel's own configuration is NOT here. It lives in panel.yaml, which the
# add-on copies to /addon_configs/hallway_panel/panel.yaml on first start so it
# can be edited with the File editor add-on and survives a rebuild. The options
# below are deployment concerns only.

name: Hallway Panel
version: "0.2.0"
slug: hallway_panel
description: >-
  Renders an 800x480 1-bit dashboard for a battery-powered e-paper display,
  and serves it over HTTP for an ESP32 to fetch.

# amd64 only: this is the architecture of the machine it was written for. On a
# Raspberry Pi, add aarch64 here and change the base image in the Dockerfile to
# match -- Supervisor no longer supplies BUILD_FROM, so it has to be explicit.
arch:
  - amd64

# The base image brings its own s6 init, so Docker's must stay out of the way.
init: false

# Start after Home Assistant, since every render needs it.
startup: application
boot: auto

# Gives the container SUPERVISOR_TOKEN and a route to http://supervisor/core,
# so no long-lived access token has to be created or stored anywhere.
homeassistant_api: true

# Two ways in, and both are needed.
#
# Ingress puts the preview in the Home Assistant sidebar, authenticated, with no
# port to remember and no exposure beyond HA itself. That is for you.
#
# The mapped port is for the ESP32, which cannot authenticate against ingress
# and needs to reach /status and /panel.png directly. Set it to null in the
# add-on's Network settings and the panel stops updating.
ingress: true
ingress_port: 8099
panel_icon: mdi:image-frame
panel_title: Hallway Panel

ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Direct access for the e-paper display (the preview is under Ingress)

# addon_config appears as /config inside the container and as
# /addon_configs/hallway_panel on the host.
map:
  - addon_config:rw

# Deployment settings and secrets only. What the panel *shows* lives in
# panel.yaml, because this schema handles flat scalars well and the nested
# lists panel.yaml is full of -- stats, waste types, sky providers, people --
# badly. Forcing those in here would make the UI worse than the file.
#
# Secrets are the exception and belong here rather than in panel.yaml: they are
# typed `password`, so Home Assistant masks them in the UI, keeps them in the
# Supervisor's store rather than a file on disk, and leaves them out of the
# YAML you would paste into a forum post asking why something is broken.
options:
  log_level: info
  cache_seconds: 45
  youversion_app_key: ""
  esv_api_key: ""

schema:
  # Deliberately not the full bashio level list: these map straight onto Python
  # logging, which has no notion of "notice" or "trace".
  log_level: list(debug|info|warning|error)?
  # How long a render is reused before rebuilding it. Guards against a browser
  # left open on /preview hammering Home Assistant; the device polls far slower
  # than this anyway.
  cache_seconds: int(5,3600)?
  # Both optional. The verse block falls back to a psalm without them.
  youversion_app_key: password?
  esv_api_key: password?
