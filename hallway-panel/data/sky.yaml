# Things worth looking up for, seen from Oxfordshire.
#
# Static rather than fetched. Meteor shower peaks land within a day of the same
# date every year, and eclipse dates are known centuries ahead, so an API would
# add a network dependency and a failure mode in exchange for nothing. Moon
# phases are computed in sky.py rather than listed.
#
# `rank` breaks ties when two things fall in the same week. Higher wins.

showers:
  # Peaks are the night of `peak`, meaning late that evening into the small
  # hours of the following morning.
  - name: Quadrantids
    peak: 01-03
    zhr: 110
    rank: 6
    note: sharp peak, only a few hours

  - name: Lyrids
    peak: 04-22
    zhr: 18
    rank: 4
    note: after midnight

  - name: Eta Aquariids
    peak: 05-06
    zhr: 50
    rank: 2
    note: radiant stays low from the UK

  - name: Perseids
    peak: 08-12
    zhr: 100
    rank: 7
    note: after 23:00

  - name: Orionids
    peak: 10-21
    zhr: 20
    rank: 4
    note: after midnight

  - name: Leonids
    peak: 11-17
    zhr: 15
    rank: 3
    note: before dawn

  - name: Geminids
    peak: 12-13
    zhr: 150
    rank: 7
    note: good all evening

  - name: Ursids
    peak: 12-22
    zhr: 10
    rank: 2
    note: before dawn

# Verified against timeanddate.com and the Royal Observatory Greenwich rather
# than written from memory.
#
# `uk` is the whole point of this table. The headline name of an eclipse says
# almost nothing about whether it is worth going outside *here*: the August 2027
# "total" is about a third covered from Oxfordshire, and a lunar eclipse you
# sleep through is no eclipse at all. So each entry records what the UK actually
# gets, and `verdict` grades it:
#
#     spectacle      set an alarm
#     worth_a_look   step outside if you are up
#     easily_missed  you will not notice without being told
#
# Solar obscuration is location-dependent and quoted for southern England.
# Lunar eclipses look the same everywhere the Moon is up, so what matters there
# is the time and whether it has set.
eclipses:
  - date: 2026-08-28
    kind: Partial lunar eclipse
    time: "05:12"
    uk: 93% covered at dawn, Moon sets during it
    verdict: worth_a_look

  - date: 2027-02-20
    kind: Penumbral lunar eclipse
    uk: a faint shading, no bite out of the Moon
    verdict: easily_missed

  - date: 2027-08-02
    kind: Partial solar eclipse
    uk: about a third covered from here
    verdict: worth_a_look

  - date: 2027-08-17
    kind: Penumbral lunar eclipse
    uk: a faint shading, no bite out of the Moon
    verdict: easily_missed

  - date: 2028-01-12
    kind: Partial lunar eclipse
    verdict: worth_a_look

  - date: 2028-01-26
    kind: Annular solar eclipse
    uk: partial from here, not a ring
    verdict: worth_a_look

  - date: 2028-07-06
    kind: Partial lunar eclipse
    verdict: worth_a_look

  - date: 2028-12-31
    kind: Total lunar eclipse
    uk: totality 16:16 to 17:27, Moon well up
    verdict: spectacle

  - date: 2029-06-12
    kind: Partial solar eclipse
    verdict: worth_a_look

  - date: 2029-06-26
    kind: Total lunar eclipse
    uk: totality 03:31 to 05:13, before dawn
    verdict: spectacle

  - date: 2029-12-20
    kind: Total lunar eclipse
    uk: totality 22:15 to 23:08, a civilised hour
    verdict: spectacle
