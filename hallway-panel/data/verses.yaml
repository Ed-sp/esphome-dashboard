# References for the verse of the day. Text is NOT stored here.
#
# References are facts and carry no copyright; the ESV text does, so it is
# fetched from Crossway's API at render time with your own key and never
# committed. That also means the panel shows the current text rather than
# whatever was pasted into a file years ago.
#
# Picked by date, so the verse is stable through the day and the list length
# decides how long it takes to come round again. Roughly a quarter of a year at
# this length -- long enough not to feel like a loop, short enough that they are
# all worth reading.
#
# Chosen to fit: each is one or two verses, because the block is a few lines of
# serif at the bottom of a panel, not a reading. Long passages get shrunk by the
# auto-fit ladder until they are technically legible and practically not.

